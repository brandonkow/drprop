<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dr Prop — 3D set preview</title>
    <style>
      body { margin: 0; background: #F4F1EA; color: #1C1B19; font: 13px/1.5 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #8A857C; }
      figure { margin: 0; background: #F4F1EA; position: relative; aspect-ratio: 4 / 3; }
      canvas { width: 100%; height: 100%; display: block; }
      figcaption { position: absolute; left: 12px; top: 8px; letter-spacing: .08em; text-transform: uppercase; color: #726D64; }
    </style>
  </head>
  <body>
    <main id="grid"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
